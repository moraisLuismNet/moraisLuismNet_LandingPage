  const projectsPerPage = 2;
  let currentPage = 1;

  function displayProjects(page) {
    const startIndex = (page - 1) * projectsPerPage;
    const endIndex = startIndex + projectsPerPage;
    const projectsToShow = projects.slice(startIndex, endIndex);

    const projectsGrid = document.getElementById('projects-grid');
    if (projectsGrid) {
      projectsGrid.innerHTML = projectsToShow.map(project => `
        <div class="project">
          <h3>${project.title}</h3>
          ${project.image ? `<img src="${basePath}/${project.image}" alt="${project.title}" />` : ''}
          <p>${project.description}</p>
          <a href="${project.link}" target="_blank">Ver en GitHub</a>
        </div>
      `).join('');
    }
  }

  function displayPagination() {
    const totalPages = Math.ceil(projects.length / projectsPerPage);
    const pagination = document.getElementById('pagination');

    if (pagination) {
      let paginationHTML = '<button id="prev-btn" disabled>Anterior</button>';

      for (let i = 1; i <= totalPages; i++) {
        paginationHTML += `<button class="page-btn" data-page="${i}">${i}</button>`;
      }

      paginationHTML += '<button id="next-btn">Siguiente</button>';

      pagination.innerHTML = paginationHTML;

      // Add event listeners to pagination buttons
      document.querySelectorAll('.page-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const target = e.target;
          if (target && target.dataset.page) {
            currentPage = parseInt(target.dataset.page);
            displayProjects(currentPage);
            updatePaginationButtons(totalPages);
          }
        });
      });

      const prevBtn = document.getElementById('prev-btn');
      if (prevBtn) {
        prevBtn.addEventListener('click', () => {
          if (currentPage > 1) {
            currentPage--;
            displayProjects(currentPage);
            updatePaginationButtons(totalPages);
          }
        });
      }

      const nextBtn = document.getElementById('next-btn');
      if (nextBtn) {
        nextBtn.addEventListener('click', () => {
          if (currentPage < totalPages) {
            currentPage++;
            displayProjects(currentPage);
            updatePaginationButtons(totalPages);
          }
        });
      }

      updatePaginationButtons(totalPages);
    }
  }

  function updatePaginationButtons(totalPages) {
    const pageBtns = document.querySelectorAll('.page-btn');
    pageBtns.forEach(btn => {
      btn.classList.remove('active');
      if (btn.dataset.page && parseInt(btn.dataset.page) === currentPage) {
        btn.classList.add('active');
      }
    });

    const prevBtn = document.getElementById('prev-btn');
    if (prevBtn) {
      prevBtn.disabled = currentPage === 1;
    }

    const nextBtn = document.getElementById('next-btn');
    if (nextBtn) {
      nextBtn.disabled = currentPage === totalPages;
    }
  }

  // Initial display
  displayProjects(currentPage);
  displayPagination();
